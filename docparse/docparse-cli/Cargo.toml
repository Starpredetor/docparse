[package]
name = "docparse-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "docparse"
path = "src/main.rs"

[dependencies]
docparse = { path = "../docparse" }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"

[features]
default = ["docparse/default"]

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
